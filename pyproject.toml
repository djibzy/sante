[project]
name = "sante"
version = "0.1.0"
description = "Écosystème de santé Mali / AES : socle commun et produits"
requires-python = ">=3.12"
dependencies = ["socle", "comptes", "boutique"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["socle", "services/*"]

[tool.uv.sources]
socle = { workspace = true }
comptes = { workspace = true }
boutique = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]  # Depends() dans les signatures FastAPI

[tool.ruff.lint.per-file-ignores]
"**/migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["socle", "comptes", "boutique"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["migrations/", "tests/"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[project]
name = "prestations"
version = "0.1.0"
description = "Service Prestations : services aux structures de santé, d'abord l'entretien du linge avec des blanchisseries partenaires"
requires-python = ">=3.12"
dependencies = [
    "socle",
    "uvicorn[standard]>=0.32",
    "alembic>=1.14",
    "fpdf2>=2.8",
    "httpx>=0.27",
]

[tool.uv.sources]
socle = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prestations"]

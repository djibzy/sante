[project]
name = "comptes"
version = "0.1.0"
description = "Service Comptes : compte unique, connexion par téléphone, organisations"
requires-python = ">=3.12"
dependencies = [
    "socle",
    "uvicorn[standard]>=0.32",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "phonenumbers>=8.13",
]

[tool.uv.sources]
socle = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comptes"]
